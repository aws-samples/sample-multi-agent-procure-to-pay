#
# Continuous integration gate. Runs on pull requests (including Dependabot's)
# and on pushes to main. The Dependabot auto-merge workflow only merges a PR
# after every job here succeeds, so this is the safety net for dependency bumps.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Allow manual runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build (tsc + vite)
        working-directory: frontend
        run: npm run build
      - name: Lint
        working-directory: frontend
        run: npm run lint

  infra:
    name: Infra (tsc compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install
        working-directory: infra
        run: npm ci
      # Type-check only. A full `cdk synth` builds an ARM64 Docker image asset
      # (backend/Dockerfile), which needs Docker and is slow/flaky in CI — the
      # compile check is enough to validate an aws-cdk-lib bump.
      - name: Compile
        working-directory: infra
        run: npm run build

  backend:
    name: Backend (import + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install (validates the dependency set resolves and imports)
        working-directory: backend
        run: |
          pip install -r requirements.txt
          python -c "import fastapi, pydantic, boto3, strands, bedrock_agentcore, mangum; print('backend imports OK')"
      # Scope: the self-contained unit tests (canonical API + models) that gate a
      # dependency bump without needing live AWS. The agent-runtime / adapter
      # tests depend on Bedrock, AgentCore, or ERP fixtures and are exercised in a
      # real environment, not this PR gate.
      - name: Unit tests
        working-directory: backend
        run: |
          python -m pytest -q \
            tests/test_canonical_api.py \
            tests/test_canonical_models.py

  security:
    name: Security + hygiene (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"
      - name: Run pre-commit hooks
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
